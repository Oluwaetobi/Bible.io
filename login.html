        <div class = "wrapper">
            <h1>Login</h1>
            <p>DO NOT ACTUALLY ENTER ANY REAL PASSWORDS!! UNDER CONSTRUCTION</p>
            <!-- supposed to be able to print my error message -->
            <p id="error-message"></p>
            <form id="form">
                <!-- Alright, so let's break this down, what does this all mean, the word type
                tells us what type of data were are working with such as text, integers, booleans and etc.
                the name data is important when extracting the data for back-end stuff, but for now we are
                only working with the front-end so we don't have to worry about that, id is important so we
                can identify the element later with javascript, the placeholder just is just to help the user
                to know what he or she needs to enter in the box -->
                <!-- without divs, it will all be the on the same lines, div create divisions and send it
                under the first thing -->
                
                <!-- addiing the additional require to type ensures that the user has entered this
                section of the field, if not the form cannot be submitted -->
               
            <div>
                <!-- it is however important to remember that you can edit svg with html but not png -->
                <label for="username-input">
                    <img src="./images/person_24dp_1F1F1F_FILL1_wght400_GRAD0_opsz24.svg" alt="person icon" width="30" height="30">
                </label>
                <input required type="text" name="username" id="username-input" placeholder="Username">
            </div>
            <div>
                <label for="password-input">
                    <img src="images/lock_24dp_1F1F1F_FILL1_wght400_GRAD0_opsz24.svg" alt = "lock icon" width="30" height="30">
                </label>
                <input required type="password" name="password" id="password-input" placeholder="Password">
            </div>
           
            <div>
                <button type="submit">Login</button>

                <button>
                    <img src="./images/sign_in_with_google_logo.png" alt="google" width="30"> 
                    Continue With Google</button>
                <!-- <button>Continue With Google</button> -->
            </div>
        </form>
        <p>You don't have an account yet, please sign up first!  <a href="index.html">Sign Up! / Create an Account</a></p>
        
    </div>
