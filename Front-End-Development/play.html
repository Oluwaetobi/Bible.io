<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible.io</title>
    <link rel="icon" type="image/png" href="./images/bibleio.png">
    <link rel = "stylesheet" href = "play.css">
</head>
<body>
    <div class = "container">
        <header>
            <div class="head-left">
                <img src= "./images/bibleio.png" alt = "Bible.io Thumbnail image" onclick="window.location.href='about.html'">
                <button onclick="window.location.href='play.html'">Bible.io</button>
            </div>
            
            <div class = "head-right">
                <p><a href="hall_of_fame.html">Hall of Fame</a></p>
                <p><a href="shop.html">Shop</a></p>
                <p><a href="learn.html">Learn</a></p>
                <p><a href="play.html">Play</a></p>
                <p><a href="account.html">Account</a></p>
                <p><a href="login.html">Login</a></p>
                <p><a href="about.html">About</a></p>
            </div>
        </header>
        
        
        <!--<p2>This website is currently under construction, stay tuned!!!</p1> -->
            
    </div>

        <!-- loading sign -->
         <div class="loader">
            <!-- <div>Bible.io is Loading</div> -->
         </div>

        <div class="big-text">
            <!-- I'm writing text into through javascript and I can take it away once the game is on or
             erase it anytime I want, that's the benefit of using javascript for the stuff instead of html
             because HTML and CSS is static but with Javscript you can erase, make animations and etc. -->
            <p id="big-text"></p>
        </div>

        <div class="modes_assets">
            <img id="choice1" src="./images/challenge_world.svg" width="300px" alt="world challenge" onclick="change_type_of_challenge(1)">
            <img id="choice2" src="./images/go_button.svg" width="200px" alt="go button" onclick="prepare_the_game()">
            <img id="choice3" src="./images/challenge_friend.svg" width="200px" alt="friend challenge" onclick="change_type_of_challenge(2)">
        </div>

        <div side-to-side>
            <div class="questions">
                <h3 id="question"></h3>
                <!-- The difference between pre and p is that, if I put 2 spaces in p, it will ignore the extra
                 spaces, but pre doesn't do the, it formats the text just as it is written -->
                <pre id="answer1"></pre>
                <pre id="answer2"></pre>
                <pre id="answer3"></pre>
                <pre id="answer4"></pre>
            </div>

            <div>
                <form id="form">
                    <input required type="text" name="questions" id="my-answer" placeholder="Enter a number (here)">
                </form>
            </div>
        </div>
        


        <!-- It's important to note that that javascript should run after the canvas loads otherwise
         there will be an error -->
        <canvas id="myCanvas"></canvas>
        <script src="play.js"></script>
    
</body>
</html>
