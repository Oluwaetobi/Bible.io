<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible.io</title>
    <link rel = "stylesheet" href = "shop.css"
</head>
<body>
    <div class = "container">
        <header>
            <div class="head-left">
                <img src= "./images/bibleio.png" alt = "Bible.io Thumbnail image">
                <button onclick="window.location.href='play.html'">Bible.io</button>
            </div>

            <div class = "head-right">
                <p><a href="hall_of_fame.html">Hall of Fame</a></p>
                <p><a href="shop.html">Shop</a></p>
                <p><a href="learn.html">Learn</a></p>
                <p><a href="play.html">Play</a></p>
                <p><a href="account.html">Account</a></p>
                <p><a href="login.html">Login</a></p>
                <p><a href="about.html">About</a></p>
            </div>
        </header>            
        </div>


        <div class="container2">

            <div class="scrollable-table" id="bibletar_designs">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Select Body Part</th>
                                <!-- <th>Rank</th>
                                <th>Name</th>
                                <th>Points</th> -->
                            </tr>
                        </thead>
            
            
                        <tbody>
                            <tr>
                                <td><img src="./images/background_logo.svg" alt="background" width="70">Backgrounds</td>
                                <!-- face logo just means, the color of your face -->
                                <td><img src="./images/face_logo.svg" alt="face color" width="70">Face Color</td>
                            </tr>
                            <tr>
                                <td><img src="./images/shirt_logo.svg" alt="shirt" width="70">Shirts</td>
                                <td><img src="./images/glasses_logo.svg" alt="glasses" width="70">Glasses</td>
                            </tr>
                            <tr>
                                <td><img src="./images/hat_logo.svg" alt="hat" width="70">Hats</td>
                                <td><img src="./images/eyes_logo.svg" alt="eyes" width="70">Eyes</td>
                            </tr>
                            <tr>
                                <td><img src="./images/nose_logo.svg" alt="nose" width="70">Noses</td>
                                <td><img src="./images/mouth_logo.svg" alt="mouth" width="70">Mouths</td>
                            </tr>
                            <tr>
                                <td id="boy_hair"><img src="./images/boy_hair_logo.svg" alt="boy hair" width="70">Hair</td>
                                <td id="girl_hair"><img src="./images/girl_hair_logo.svg" alt="girl hair" width="70">Hair</td>
                            </tr>
                                                  
                            
    
                            
                        </tbody>
                    </table>
        
                </div>



                <div class="scrollable-table-background" id="choose_bibletar_stuff">
                    <table class="table-background">
                        <thead>
                            <tr>
                                <th>Click to choose</th>
                            </tr>
                        </thead>
            
            
                        <tbody>
                            <tr>
                                <td><img src="./images/background1.svg" alt="background" width="100"></td>
                                <td><img src="./images/background2.svg" alt="face color" width="100"></td>
                                <td><img src="./images/background3.svg" alt="face color" width="100"></td>
                            </tr>       
                            
    
                            
                        </tbody>
                    </table>
        
                </div>


        </div>


        <!-- New Div for Shop -->
         <div id="shop_page_background">
            <img src="./images/shop_page_background.svg" alt="shop page background" width="700px">
         </div>

         <div class="scrollable-table-shop" id="choose_shop_stuff">
            <table class="table-shop">
                        <thead>
                            <tr>
                                <!-- I don't need a header, actually I DO!! -->
                                <th>Backgrounds</th>
                                <th>Face Colors</th>
                                <th>Shirts</th>
                                <th>Glasses</th>
                                <th>Hats</th>
                                <th>Eyes</th>
                                <th>Noses</th>
                                <th>Mouths</th>
                                <th>Hair</th>
                            </tr>
                        </thead>
            
            
                        <tbody>
                            <tr>
                                <td><img src="./images/background1.svg" alt="background" width="100"></td>
                                <td> Cost: $5</td>
                                <td><img src="./images/background2.svg" alt="face color" width="100"></td>
                                <td> Cost: $5</td>
                                <td><img src="./images/background3.svg" alt="face color" width="100"></td>
                                <td> Cost: $5</td>
                            </tr>       
                            
    
                            
                        </tbody>
                    </table>
         </div>


         
        

        <div class="bibletar-text" id="bibletar_page_1_text">
            <h1 id="bibletar-title">Bibletar Maker</h1>
            <!-- <p id="bibletar-sub-section"></p> -->
        </div>
        
        
        <div class="boy-or-girl" id="bibletar_girl_or_boy">
            <!-- <h2 id="boy-or-girl">Boy Girl</h2> -->
            <img src="./images/bibletar_boys_section.png" onclick="boy_bibletar()">
            <img src="./images/bibletar_girls_section.png" onclick="girl_bibletar()">
        </div>
           

        <canvas id="myCanvas"></canvas>
        <script src="shop.js"></script>
    
</body>
</html>
